[package]
name = "accounting-desktop"
description = "TallyCheck — offline desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "accounting_desktop_lib"
crate-type = ["rlib"]

[features]
# D47: the Microsoft Store build (MSIX). No in-app updater: the Store updates the app.
store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
api-server.workspace = true
serde_json.workspace = true
app-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tracing.workspace = true
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
# D49: Windows Hello / Windows password check for password recovery (already in the tree via Tauri).
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
windows-future = "0.3"

[lints]
workspace = true
