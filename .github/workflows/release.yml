# D77: builds the TallyCheck installer from this public repository, makes the update signature
# and latest.json for the in-app updater (D45) and puts everything in a DRAFT GitHub release.
# A person checks the draft and publishes it; only a published release reaches the app.
# The installer is not code-signed (SignPath, D48, is no longer used), so Windows SmartScreen
# warns about it; the update signature still protects in-app updates.
#
# Needs (Settings → Secrets and variables → Actions):
#   secrets.TAURI_SIGNING_PRIVATE_KEY        contents of updater.key (the update key)
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD

name: Release

# Run by hand only (Actions → Release → Run workflow): TallyCheck is released through the
# Microsoft Store and the Mac app, so a version tag does not build the direct installer.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the app's update window)"
        required: true

permissions:
  contents: write # create the draft release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved to other code).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps don't push; gh uses GH_TOKEN
          fetch-depth: 0 # Preserve compares with every earlier release tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Version and tag agree
        id: version
        shell: pwsh
        # Values from the event go through env:, never into the script text itself.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            throw "Tag $env:REF_NAME does not match the app version $v"
          }

      # Preserve (docs/preserve.md): blocks the release before anything is built when installed
      # copies would lose their books, their update key or their identity.
      - name: Preserve pre-flight (installed copies stay safe)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python -I -X utf8 tools/desktop_preflight.py "v$env:VERSION"

      # No dependency needs its install script (core-js only prints a message, fsevents is
      # macOS only), so none are run.
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      # Built WITHOUT the update key: npm packages and build scripts never see it. The update
      # signature is made in the next step, the only one that has the key.
      - name: Installer (no update signature yet)
        # bash: PowerShell would swallow the "--" that hands --config on to `tauri build`.
        shell: bash
        run: |
          npm ci --ignore-scripts
          override="$RUNNER_TEMP/no-updater-artifacts.json"
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$override"
          npm run installer -- --config "$override"

      - name: Update signature and latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NOTES: ${{ github.event.inputs.notes || 'See the release notes on GitHub.' }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $v = $env:VERSION
          $exe = "TallyCheck_${v}_x64-setup.exe"
          $bundle = "target/release/bundle/nsis"
          Remove-Item "$bundle/$exe.sig" -ErrorAction SilentlyContinue
          npx --no-install tauri signer sign "$bundle/$exe"
          if (-not (Test-Path "$bundle/$exe.sig")) { throw "no update signature" }
          python tools/release.py --skip-build --notes "$env:NOTES" `
            --download-base "https://github.com/$env:REPOSITORY/releases/download/v{version}"

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $bundle = "target/release/bundle/nsis"
          gh release create "v$v" --draft --title "TallyCheck $v" --notes "Draft: check, then publish." `
            "$bundle/TallyCheck_${v}_x64-setup.exe" "$bundle/TallyCheck-setup.exe" "$bundle/latest.json"
