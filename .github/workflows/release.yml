# D48: builds the TallyCheck installer from this public repository, has it code-signed by
# SignPath Foundation (free for open source projects), then makes the update signature and
# latest.json for the in-app updater (D45) and puts everything in a DRAFT GitHub release.
# A person checks the draft and publishes it; only a published release reaches the app.
#
# Needs (Settings → Secrets and variables → Actions):
#   secrets.SIGNPATH_API_TOKEN               SignPath CI user's API token
#   vars.SIGNPATH_ORGANIZATION_ID            SignPath organization id
#   secrets.TAURI_SIGNING_PRIVATE_KEY        contents of updater.key (the update key)
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Every signing request also needs a manual approval in SignPath (their rule).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the app's update window)"
        required: true

permissions:
  contents: write # create the draft release
  actions: read # SignPath reads the uploaded artifact

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved to other code).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # later steps don't push; gh uses GH_TOKEN

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Version and tag agree
        id: version
        shell: pwsh
        # Values from the event go through env:, never into the script text itself.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$v") {
            throw "Tag $env:REF_NAME does not match the app version $v"
          }

      # No dependency needs its install script (core-js only prints a message, fsevents is
      # macOS only), so none are run.
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      # Built WITHOUT the update key: npm packages and build scripts never see it. The update
      # signature is made later, from the code-signed file, in the only step that has the key.
      - name: Installer (unsigned, no update signature)
        # bash: PowerShell would swallow the "--" that hands --config on to `tauri build`.
        shell: bash
        run: |
          npm ci --ignore-scripts
          override="$RUNNER_TEMP/no-updater-artifacts.json"
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$override"
          npm run installer -- --config "$override"

      - name: Upload the installer for signing
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-installer
          path: target/release/bundle/nsis/TallyCheck_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error

      - name: Code-sign with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tallycheck
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed

      # Code signing changed the file, so the update signature is made now, from the signed file.
      - name: Update signature and latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NOTES: ${{ github.event.inputs.notes || 'See the release notes on GitHub.' }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $v = $env:VERSION
          $exe = "TallyCheck_${v}_x64-setup.exe"
          $bundle = "target/release/bundle/nsis"
          Copy-Item "signed/$exe" "$bundle/$exe" -Force
          Remove-Item "$bundle/$exe.sig" -ErrorAction SilentlyContinue
          npx --no-install tauri signer sign "$bundle/$exe"
          if (-not (Test-Path "$bundle/$exe.sig")) { throw "no update signature" }
          python tools/release.py --skip-build --notes "$env:NOTES" `
            --download-base "https://github.com/$env:REPOSITORY/releases/download/v{version}"

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $bundle = "target/release/bundle/nsis"
          gh release create "v$v" --draft --title "TallyCheck $v" --notes "Draft: check, then publish." `
            "$bundle/TallyCheck_${v}_x64-setup.exe" "$bundle/TallyCheck-setup.exe" "$bundle/latest.json"
