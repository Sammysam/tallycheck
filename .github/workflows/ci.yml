# CI: on every push and pull request, run the same checks as tools/ci.ps1 (formatting, frontend
# build, npm advisories, clippy, all tests) on a Windows machine and on a Mac (D53). Releases are
# release.yml (Windows) and macos.yml (Mac).
# Needs no secrets.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"] # a release tag runs release.yml instead
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be moved to other code).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # rustup downloads the toolchain from rust-toolchain.toml on first use; a short network
      # failure there must not fail the run, so try up to 3 times before the real work.
      - name: Install Rust (with retries)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            cargo --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Rust download failed (try $i of 3); trying again shortly"
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Checks
        shell: pwsh
        run: ./tools/ci.ps1

  # D53: the same checks on macOS (Keychain secrets, the Mac data folder, the Mac build of the shell).
  checks-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # rustup downloads the toolchain from rust-toolchain.toml on first use; a short network
      # failure there must not fail the run, so try up to 3 times before the real work.
      - name: Install Rust (with retries)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            cargo --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Rust download failed (try $i of 3); trying again shortly"
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Checks
        shell: pwsh
        run: ./tools/ci.ps1
