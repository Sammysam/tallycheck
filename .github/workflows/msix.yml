# D47: builds the Microsoft Store package (MSIX) on GitHub. Run it by hand (Actions → Microsoft
# Store package → Run workflow) or push a tag v<version>; the .msix is attached to the run as an
# artifact. Upload it in Partner Center → TallyCheck.io → Submission → Packages.
#
# Needs no secrets: the Store signs the package itself after certification. The identity below is
# the app's reserved identity from Partner Center (Product management → Product identity); it is
# not secret (every MSIX carries it) and must match Partner Center exactly.

name: Microsoft Store package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  MSIX_IDENTITY_NAME: Cenango.TallyCheck.io
  MSIX_PUBLISHER: CN=10446E21-680A-45CC-AC6E-7844866B02E5
  MSIX_PUBLISHER_DISPLAY_NAME: Cenango
  MSIX_DISPLAY_NAME: TallyCheck.io
  PYTHONIOENCODING: utf-8

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # rustup downloads the toolchain from rust-toolchain.toml on first use; a short network
      # failure there must not fail the run, so try up to 3 times before the real work.
      - name: Install Rust (with retries)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            cargo --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Rust download failed (try $i of 3); trying again shortly"
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      # Pillow makes the Store tile images from the app icon.
      - name: Tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build the MSIX
        shell: pwsh
        run: |
          python tools/build_msix.py --identity-name $env:MSIX_IDENTITY_NAME --publisher $env:MSIX_PUBLISHER `
            --publisher-display-name $env:MSIX_PUBLISHER_DISPLAY_NAME --display-name $env:MSIX_DISPLAY_NAME

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TallyCheck-MicrosoftStore
          path: target/msix/TallyCheck_*_x64.msix
          if-no-files-found: error
