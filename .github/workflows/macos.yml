# D53: builds the Mac app (universal: Apple silicon and Intel) as a disk image, signed with the
# company's Developer ID and notarized by Apple when the secrets below are set; unsigned otherwise.
# Run it by hand (Actions → macOS app → Run workflow) or push a tag v<version>.
# The .dmg is attached to the run as an artifact for a person to test and publish.
#
# Repository secrets (Settings → Secrets and variables → Actions), never in the repository:
#   APPLE_CERTIFICATE           the Developer ID Application certificate, .p12, base64-encoded
#   APPLE_CERTIFICATE_PASSWORD  the .p12 password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <Company> (<TEAM ID>)"
#   APPLE_API_ISSUER            App Store Connect API key: issuer ID
#   APPLE_API_KEY               App Store Connect API key: key ID
#   APPLE_API_KEY_P8            App Store Connect API key: contents of the .p8 file

name: macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # rustup downloads the toolchain from rust-toolchain.toml on first use; a short network
      # failure there must not fail the run, so try up to 3 times before the real work.
      - name: Install Rust (with retries)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            cargo --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Rust download failed (try $i of 3); trying again shortly"
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The API key file exists only on this runner, for this run.
      - name: Notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            umask 077
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
          else
            echo "No notarization key: the app will not be notarized."
          fi

      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash tools/build_macos.sh

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TallyCheck-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
