[package]
name = "mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cenango Accounting's MCP server: lets Claude read the books and create drafts"

[[bin]]
name = "cenango-mcp"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }


[dev-dependencies]
api-server.workspace = true
app-core.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
